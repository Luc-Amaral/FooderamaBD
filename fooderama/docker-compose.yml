services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=fooderama
      - DB_PORT=3306
      - SECRET_KEY=supersecretkey
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app/static:/app/app/static:ro
      - ./app/templates:/app/app/templates:ro
    networks:
      - fooderama-network
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=fooderama
      # Remover estas linhas que causam conflito:
      # - MYSQL_USER=root
      # - MYSQL_PASSWORD=root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BANDO DE DADOS:/docker-entrypoint-initdb.d:ro
    networks:
      - fooderama-network
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      timeout: 30s
      retries: 5
      interval: 10s
      start_period: 60s
    command: --default-authentication-plugin=mysql_native_password

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - fooderama-network
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=db

volumes:
  mysql_data:

networks:
  fooderama-network:
    driver: bridge
