{% extends 'base.html' %}
{% block conteudo %}

<div class="mt-12 sm:mx-auto sm:w-full sm:max-w-sm bg-white shadow-lg rounded-lg p-6">

  <div class="flex min-h-full flex-col justify-center px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-sm">
      <img class="px-8 py-12 max-w-full h-auto" src="../static/images/fooderama.png" alt="Your Company">
      <h2 class="my-6 text-center text-3xl font-bold tracking-tight text-gray-900">Entre na sua conta</h2>
    </div>
    <form class="space-y-6" action="{{ url_for('auth.autenticar_login') }}" method="POST">
      <div>
        <label for="email" class="block text-sm/6 font-medium text-gray-900">Email</label>
        <div class="mt-2">
          <input id="email" name="email" autocomplete="email" required
            class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6">
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between">
          <label for="password" class="block text-sm/6 font-medium text-gray-900">Senha</label>
        </div>
        <div class="mt-2">
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6">
        </div>
      </div>

      <div>
        <button type="submit"
          class="flex w-full justify-center rounded-md bg-black px-3 py-1.5 text-sm/6 font-semibold text-white shadow-sm hover:bg-gray-800">Entrar</button>
      </div>
    </form>



    <p class="mt-10 text-center text-sm/6">
      Sem cadastro? <span class="text-black">Entre como:</span>
    </p>
    <div class="flex justify-center items-center gap-x-3 h-full">
      <form action="{{ url_for('auth.register_cliente') }}" method="get" class="w-1/2 h-full">
        <button type="submit"
          class="w-full h-full rounded-md bg-transparent border-2 border-black px-3 py-1.5 text-sm/6 font-semibold text-black shadow-sm hover:border-gray-800 hover:bg-gray-800 hover:text-white">Cliente</button>
      </form>
      <form action="{{ url_for('auth.register_restaurante') }}" method="get" class="w-1/2 h-full">
        <button type="submit"
          class="w-full h-full rounded-md bg-transparent border-2 border-black px-3 py-1.5 text-sm/6 font-semibold text-black shadow-sm hover:border-gray-800 hover:bg-gray-800 hover:text-white">Restaurante</button>
      </form>
    </div>
  </div>
</div>



{% endblock %}
