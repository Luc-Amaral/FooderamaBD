{% extends 'base.html' %} {% block conteudo %}

<form
  class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8"
  action="{{ url_for('auth.register_cliente') }}"
  method="POST"
>
  <div
    class="sm:mx-auto sm:w-full sm:max-w-sm bg-white shadow-lg rounded-lg p-6"
  >
    <div class="border-b border-gray-900/10 pb-12">
      <h2 class="text-2xl font-semibold text-gray-900">Informações Gerais</h2>

      <div class="mt-10 flex flex-col gap-y-8">
        <div class="flex flex-col">
          <label for="email" class="block text-sm/6 font-medium text-gray-900"
            >Email</label
          >
          <div class="mt-2">
            <input
              name="email"
              id="email"
              required
              autocomplete="email"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>

        <div class="flex flex-col">
          <label
            for="password"
            class="block text-sm/6 font-medium text-gray-900"
            >Senha</label
          >
          <div class="mt-2">
            <input
              type="password"
              name="password"
              id="password"
              required
              autocomplete="current-password"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>

        <div class="flex flex-col">
          <label for="phone" class="block text-sm/6 font-medium text-gray-900"
            >Telefone</label
          >
          <div class="mt-2">
            <input
              type="tel"
              name="phone"
              id="phone"
              required
              autocomplete="tel"
              maxlength="9"
              pattern="[0-9]{9}"
              placeholder="999999999"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>

        <!-- Tópico principal: Endereço -->
        <h3 class="text-lg font-semibold text-gray-900">Endereço</h3>
        <span id="message" class="text-sm text-gray-500 mt-[-30px]"
          >Registrar endereço agora é opcional.</span
        >
        <span id="messageAlert" class="text-sm text-red-600 hidden mt-[-30px]"
          >Por favor, registre todos os campos do endereço!</span
        >

        <div class="flex flex-col">
          <label for="street" class="block text-sm font-medium text-gray-900"
            >Rua</label
          >
          <div class="mt-2">
            <input
              type="text"
              id="street"
              name="street"
              onblur="showMessage()"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
            />
          </div>
        </div>

        <div class="flex flex-col">
          <label
            for="neighborhood"
            class="block text-sm font-medium text-gray-900"
            >Bairro</label
          >
          <div class="mt-2">
            <input
              type="text"
              id="neighborhood"
              name="neighborhood"
              onblur="showMessage()"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
            />
          </div>
        </div>

        <div class="flex gap-x-8">
          <div class="flex flex-col w-1/2">
            <label for="number" class="block text-sm font-medium text-gray-900"
              >Número</label
            >
            <div class="mt-2">
              <input
                type="text"
                id="number"
                name="number"
                onblur="showMessage()"
                class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
              />
            </div>
          </div>

          <div class="flex flex-col w-1/2">
            <label for="cep" class="block text-sm font-medium text-gray-900"
              >CEP</label
            >
            <div class="mt-2">
              <input
                type="text"
                id="cep"
                name="cep"
                onblur="showMessage()"
                maxlength="8"
                class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="border-b border-gray-900/10 pb-12 pt-6">
      <h2 class="text-2xl font-semibold text-gray-900">
        Informações do Cliente
      </h2>

      <div class="mt-10 flex flex-col gap-y-8">
        <div class="flex gap-x-8">
          <div class="flex flex-col w-1/2">
            <label
              for="first-name"
              class="block text-sm/6 font-medium text-gray-900"
              >Nome</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="first-name"
                id="first-name"
                required
                autocomplete="given-name"
                class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
              />
            </div>
          </div>
          <div class="flex flex-col w-1/2">
            <label
              for="last-name"
              class="block text-sm/6 font-medium text-gray-900"
              >Sobrenome</label
            >
            <div class="mt-2">
              <input
                type="text"
                name="last-name"
                id="last-name"
                required
                autocomplete="family-name"
                class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
              />
            </div>
          </div>
        </div>

        <div class="flex flex-col">
          <label for="cpf" class="block text-sm/6 font-medium text-gray-900"
            >CPF</label
          >
          <div class="mt-2">
            <input
              type="text"
              name="cpf"
              id="cpf"
              required
              autocomplete="off"
              maxlength="11"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6 flex items-center gap-x-6">
      <button
        type="button"
        id="cancelButton"
        class="text-sm/6 font-semibold text-gray-900"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="rounded-md bg-black px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-gray-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-800"
      >
        Save
      </button>
    </div>
  </div>
</form>

<script src="{{ url_for('static', filename='js/registerCli.js') }}"></script>

{% endblock %}
