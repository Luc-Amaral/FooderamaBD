{% extends 'base.html' %} {% block conteudo %}

<div class="min-h-screen bg-gray-100 py-8">

    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">
            Editar Horários de Funcionamento
          </h1>
          <p class="text-gray-600 mt-1">
            Configure os horários de funcionamento do seu restaurante
          </p>
        </div>
        <button
          onclick="voltarParaRestaurante()"
          class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-medium"
        >
          Voltar
        </button>
      </div>

              >Segunda-feira</label
            >
            <div class="flex items-center gap-6">
              <label class="flex items-center">
                <input
                  type="checkbox"
                  name="segunda_ativo"
                  id="segunda_ativo"
                  class="mr-3 h-4 w-4 text-blue-600"
                />
                <span class="text-gray-700 font-medium">Aberto</span>
              </label>
              <div class="flex items-center gap-4">
                <div>
                  <label class="block text-sm text-gray-600 mb-1"
                    >Abertura</label
                  >
                  <input
                    type="time"
                    name="segunda_abertura"
                    id="segunda_abertura"
                    value="08:00"
                    class="px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                  />
                </div>
                <div>
                  <label class="block text-sm text-gray-600 mb-1"
