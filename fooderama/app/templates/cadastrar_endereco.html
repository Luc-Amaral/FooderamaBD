{% extends 'base.html' %}
{% block conteudo %}
<div class="flex flex-col bg-white shadow-lg rounded-lg p-6 max-w-4xl mx-auto mt-12">
    <h2 class="text-2xl font-semibold text-gray-900 text-left border-b border-gray-900/10 pb-4">Cadastrar Endereço</h2>
    <form action="/cadastrar_endereco" method="POST" class="mt-6 flex flex-col gap-4">
        <div class="flex flex-col">
            <!-- Tópico principal: Endereço -->
            <h3 class="text-lg font-semibold text-gray-900 mb-4">Endereço</h3>

            <div class="flex flex-col">
                <label for="street" class="block text-sm font-medium text-gray-900">Rua</label>
                <div class="mt-2">
                    <input type="text" id="street" name="street" required
                        class="mb-2 pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm">
                </div>
            </div>

            <div class="flex flex-col">
                <label for="neighborhood" class="block text-sm font-medium text-gray-900">Bairro</label>
                <div class="mt-2">
                    <input type="text" id="neighborhood" name="neighborhood" required
                        class=" mb-2 pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm">
                </div>
            </div>

            <div class="flex gap-x-8">
                <div class="flex flex-col w-1/2">
                    <label for="number" class="block text-sm font-medium text-gray-900">Número</label>
                    <div class="mt-2">
                        <input type="text" id="number" name="number" required
                            class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm">
                    </div>
                </div>
                <div class="flex flex-col w-1/2">
                    <label for="cep" class="block text-sm font-medium text-gray-900">CEP</label>
                    <div class="mt-2">
                        <input type="text" id="cep" name="cep" required maxlength="8"
                            class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm">
                    </div>
                </div>
            </div>
        </div>

        <button type="submit"
            class="self-end bg-black text-white px-3 py-2 rounded-md hover:bg-gray-800 transition-colors duration-200 text-sm font-semibold">Cadastrar</button>
    </form>
</div>

<div class="flex flex-col bg-white shadow-lg rounded-lg p-6 max-w-4xl mx-auto mt-10 mb-4">
    <h2 class="text-2xl font-semibold text-gray-900 text-left pb-4">Endereços Cadastrados</h2>
    <div class="mt-6 flex flex-col gap-4">
        {% for address in addresses %}
<div class="flex flex-col gap-2 border-t">
    <div class="flex items-center justify-between mt-2">
        <h3 class="text-lg font-semibold text-gray-900">{{ address.rua }}</h3>
    </div>
    <p class="text-sm text-gray-600">Bairro: {{ address.bairro }}</p>
    <p class="text-sm text-gray-600">Número: {{ address.numero }}</p>
    <div class="flex items-center justify-between">
        <p class="text-sm text-gray-600">CEP: {{ address.cep }}</p>
        <form action="/alterar_endereco/{{ address.id }}" method="POST">
            <button type="submit" class="text-sm font-medium text-blue-500 hover:text-blue-700">Escolher</button>
        </form>
    </div>
</div>
{% endfor %}
    </div>
</div>

{% endblock %}
