{% extends 'base.html' %} {% block conteudo %}
<div class="flex flex-col py-2 lg:px-[33rem]">
  <div class="mt-10 flex flex-col gap-6 bg-white shadow-lg rounded-lg p-6">
    <h2
      class="text-2xl font-semibold text-gray-900 text-left border-b border-gray-900/10 pb-4"
    >
      Lista de Restaurantes
    </h2>

    {% for restaurante in restaurantes %}
    <a
      href="/restaurant?restaurant_id={{ restaurante.ID_Restaurante }}&food-type={{ food_type }}"
      id="openButton"
      class="group flex items-center border-[1px] border-gray-200 rounded-3xl px-2 py-2 hover:scale-[1.01] hover:shadow-lg hover:ring-1 hover:ring-gray-900/5 transition-transform duration-300"
    >
      <div class="w-32 h-32 overflow-hidden rounded-2xl bg-gray-200">
        <img
          src="../static/images/tipos_comida/{{ (restaurante.TipoComida or 'default') | lower }}.png"
          alt="{{ restaurante.TipoComida or 'Tipo não especificado' }}"
          class="h-full w-full object-cover object-center group-hover:opacity-75"
        />
      </div>
      <div class="ml-4 flex flex-col items-start text-sm">
        <div class="mt-2">
          <p>{{ restaurante.NomeRestaurante }}</p>
        </div>
        <div class="flex items-center">
          <p id="food-type-title" class="text-sm text-gray-500">
            {{ restaurante.TipoComida or 'Tipo não especificado' }} •
          </p>
          <span
            id="score_menu"
            class="inline-flex items-center justify-center text-orange-400 ml-2"
          >
            {{ medias_avaliacoes[restaurante.ID_Restaurante] | round(1) }}
            <img
              src="../static/images/star-fill.svg"
              alt=""
              class="ml-1 w-4 h-4"
            />
          </span>
        </div>
      </div>
    </a>
    {% endfor %}
  </div>
</div>

<script src="{{ url_for('static', filename='js/listar_lojas.js') }}"></script>
{% endblock %}
