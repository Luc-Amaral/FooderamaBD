{% extends 'base.html' %} {% block conteudo %}

<form
  class="flex min-h-full flex-col justify-center px-6 py-12 lg:px-8"
  action="/registerRest"
  method="POST"
>
  <div
    class="sm:mx-auto sm:w-full sm:max-w-sm bg-white shadow-lg rounded-lg p-6"
  >
    <div class="border-b border-gray-900/10 pb-12">
      <h2 class="text-2xl font-semibold text-gray-900">Informações Gerais</h2>

      <div class="mt-10 flex flex-col gap-y-8">
        <!-- Email Field -->
        <div class="flex flex-col">
          <label for="email" class="block text-sm/6 font-medium text-gray-900"
            >Email</label
          >
          <div class="mt-2">
            <input
              name="email"
              id="email"
              required
              autocomplete="email"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="flex flex-col">
          <label
            for="password"
            class="block text-sm/6 font-medium text-gray-900"
            >Senha</label
          >
          <div class="mt-2">
            <input
              type="password"
              name="password"
              id="password"
              required
              autocomplete="current-password"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>

        <!-- Phone Field -->
        <div class="flex flex-col">
          <label for="phone" class="block text-sm/6 font-medium text-gray-900"
            >Telefone</label
          >
          <div class="mt-2">
            <input
              type="tel"
              name="phone"
              id="phone"
              required
              autocomplete="tel"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>

        <!-- Tópico principal: Endereço -->
        <h3 class="text-lg font-semibold text-gray-900">Endereço</h3>

        <div class="flex flex-col">
          <label for="street" class="block text-sm font-medium text-gray-900"
            >Rua</label
          >
          <div class="mt-2">
            <input
              type="text"
              id="street"
              name="street"
              required
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
            />
          </div>
        </div>

        <div class="flex flex-col">
          <label
            for="neighborhood"
            class="block text-sm font-medium text-gray-900"
            >Bairro</label
          >
          <div class="mt-2">
            <input
              type="text"
              id="neighborhood"
              name="neighborhood"
              required
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
            />
          </div>
        </div>

        <div class="flex gap-x-8">
          <div class="flex flex-col w-1/2">
            <label for="number" class="block text-sm font-medium text-gray-900"
              >Número</label
            >
            <div class="mt-2">
              <input
                type="text"
                id="number"
                name="number"
                required
                class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
              />
            </div>
          </div>
          <div class="flex flex-col w-1/2">
            <label for="cep" class="block text-sm font-medium text-gray-900"
              >CEP</label
            >
            <div class="mt-2">
              <input
                type="text"
                id="cep"
                name="cep"
                required
                maxlength="8"
                class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm"
              />
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="border-b border-gray-900/10 pb-12 pt-6">
      <h2 class="text-2xl font-semibold text-gray-900">
        Informações do Restaurante
      </h2>

      <div class="mt-10 flex flex-col gap-y-8">
        <!-- Restaurant Name Field -->
        <div class="flex flex-col">
          <label
            for="name-restaurant"
            class="block text-sm/6 font-medium text-gray-900"
            >Nome do Restaurante</label
          >
          <div class="mt-2">
            <input
              type="text"
              name="name-restaurant"
              id="name-restaurant"
              required
              autocomplete="given-name"
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>

        <!-- Cuisine Type Field (Dropdown) -->
        <div class="flex flex-col">
          <label
            for="type-food"
            class="block text-sm/6 font-medium text-gray-900"
            >Tipo Culinária</label
          >
          <div class="mt-2">
            <select
              name="type-food"
              id="type-food"
              required
              class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            >
              <option value="Default" disabled selected>---</option>
              <option value="Pizza">Pizza</option>
              <option value="Massa">Massa</option>
              <option value="Comida Caseira">Caseira</option>
              <option value="Sorvete">Sorvete</option>
              <option value="Churrasco">Churrasco</option>
              <option value="Lanche">Lanche</option>
              <option value="Frutos do Mar">Frutos do Mar</option>
              <option value="Vegetariana">Vegetariana</option>
              <option value="Japonesa">Japonesa</option>
              <option value="Mexicana">Mexicana</option>
              <option value="Arabe">Arabe</option>
              <option value="Doce">Doce</option>
            </select>
          </div>
        </div>

        <!-- Opening Hours Field -->
        <div class="flex flex-col">
          <label
            for="opening-hours"
            class="block text-sm/6 font-medium text-gray-900"
            >Hora de Funcionamento</label
          >
          <div class="mt-2 flex gap-4">
            <input
              type="time"
              name="opening-time"
              id="opening-time"
              required
              class="pl-2 block w-1/2 rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
            <span class="self-center text-gray-500">às</span>
            <input
              type="time"
              name="closing-time"
              id="closing-time"
              required
              class="pl-2 block w-1/2 rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm/6"
            />
          </div>
        </div>
      </div>
    </div>

    <div class="mt-6 flex items-center gap-x-6">
      <button
        type="button"
        id="cancelButton"
        class="text-sm/6 font-semibold text-gray-900"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="rounded-md bg-black px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-gray-800"
      >
        Save
      </button>
    </div>
  </div>
</form>

<script src="{{ url_for('static', filename='js/registerRest.js') }}"></script>

{% endblock %}
