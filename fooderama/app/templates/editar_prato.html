{% extends 'base.html' %}
{% block conteudo %}
<div class="flex flex-col bg-white shadow-lg rounded-lg p-6 max-w-4xl mx-auto mt-12">
    <h2 class="text-2xl font-semibold text-gray-900 text-left border-b border-gray-900/10 pb-4">Editar Comida</h2>
    <form method="POST" class="mt-6 flex flex-col gap-4">
        <div class="flex flex-col">
            <label for="food_name" class="block text-sm font-medium text-gray-900">Nome da Comida</label>
            <div class="mt-2">
                <input type="text" id="food_name" name="food_name" value="{{ food.Nome }}"
                    class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm">
            </div>
        </div>

        <div class="flex flex-col">
            <label for="description" class="block text-sm font-medium text-gray-900">Descrição</label>
            <div class="mt-2">
                <textarea id="description" name="description" rows="4" maxlength="300" placeholder="Descrição"
                    class="pl-2 block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm">{{ food.Descricao }}</textarea>
            </div>
        </div>

        <div class="flex flex-col">
            <label for="price" class="block text-sm font-medium text-gray-900">Preço</label>
            <div class="mt-2 flex items-center">
                <span class="px-3 text-gray-500">R$</span>
                <input type="number" id="price" name="price" value="{{ food.Preco }}"
                    class="pl-2 block w-2/12 rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-gray-800 sm:text-sm">
            </div>
        </div>

        <div class="flex flex-col gap-2 mt-4">
            <label class="block text-sm font-medium text-gray-900">Status de Disponibilidade da Comida</label>
            <div class="flex items-center gap-4">
                <label class="flex items-center">
                    <input type="radio" name="status" value="ativo" {% if food.StatusDisponibilidade == 1 %}checked{% endif %} class="mr-2">
                    Ativo
                </label>
                <label class="flex items-center">
                    <input type="radio" name="status" value="inativo" {% if food.StatusDisponibilidade == 0 %}checked{% endif %} class="mr-2">
                    Inativo
                </label>
            </div>
        </div>

        <button type="submit"
            class="self-end bg-black text-white px-3 py-2 rounded-md hover:bg-gray-800 transition-colors duration-200 text-sm font-semibold">Salvar Alterações</button>
    </form>
</div>
{% endblock %}
